activityCompose = "1.9.3"
lifecycle = "2.10.0"
navigation = "2.8.5"
composeBom = "2025.09.01"
room = "2.8.3"
coil = "2.7.0"
coroutines = "1.10.1"
serialization = "1.8.0"
junit = "4.13.2"
robolectric = "4.16"
androidxTestCore = "1.7.0-rc01"
